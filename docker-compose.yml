version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: law_vector_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin2906
      POSTGRES_DB: law_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: